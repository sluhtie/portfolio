<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Per-page tags (title, description, canonical, hreflang, OG, JSON-LD) are
         injected at build time by scripts/prerender.mjs from src/lib/seo.ts. -->
    <!--app-head-->
    <meta name="author" content="Connor Welge" />
    <meta name="theme-color" content="#08070a" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts (Fontshare) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <!-- Loaded without blocking the first paint; the preloader covers the swap. -->
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600&f[]=gambetta@400,401,500&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600&f[]=gambetta@400,401,500&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600&f[]=gambetta@400,401,500&display=swap"
      />
    </noscript>

    <!-- Analytics (Umami, self-hosted, cookieless) -->
    <script
      defer
      src="https://analytics.cwcodes.de/script.js"
      data-website-id="ee5d3ef8-3f3e-4f5c-b020-c468340e7ec0"
      data-domains="www.cwcodes.de,cwcodes.de"
      data-do-not-track="true"
    ></script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--noscript-home:start-->
    <noscript>
      <style>#root { display: none; }</style>
      <div style="max-width: 640px; margin: 12vh auto; padding: 0 24px; font-family: system-ui, sans-serif; color: #ecebe4; background: #08070a;">
        <h1>Connor Welge — Webdesign &amp; Webentwicklung in Hamburg</h1>
        <p>
          CWCODES — moderne, hochwertige Websites und digitale Erlebnisse für
          Unternehmen und Marken. Freelance Webentwicklung &amp; Webdesign aus
          Hamburg.
        </p>
        <p>
          Kontakt: <a style="color: #ccff00" href="mailto:connor@cwcodes.de">connor@cwcodes.de</a>
        </p>
        <p>
          <a style="color: #908d99" href="/impressum">Impressum</a> ·
          <a style="color: #908d99" href="/datenschutz">Datenschutz</a>
        </p>
        <p>Bitte aktiviere JavaScript, um die vollständige Seite zu sehen.</p>
      </div>
    </noscript>
    <!--noscript-home:end-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
