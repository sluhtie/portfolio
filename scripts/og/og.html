<!doctype html>
<!--
  Open Graph image (1200×630). Rendered to public/og-image.jpg (DE) and
  public/og-image-en.jpg (EN) by render.mjs — open with ?lang=en to preview.
  Same motif as the printed business card: violet / lime / teal glows on
  near-black, the CW monogram inside the squircle ring.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500&f[]=gambetta@401&display=block"
    />
    <style>
      :root {
        --bg: #08070a;
        --ink: #ecebe4;
        --muted: #908d99;
        --violet: #7c5cff;
        --lime: #ccff00;
        --teal: #00e0c6;
        --display: "Clash Display", "Inter Display", sans-serif;
        --sans: "General Sans", "Inter", sans-serif;
        --serif: "Gambetta", "Instrument Serif", serif;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--sans);
        background:
          radial-gradient(640px 500px at 4% -6%, rgba(124, 92, 255, 0.72), transparent 70%),
          radial-gradient(420px 320px at 62% 52%, rgba(160, 200, 0, 0.16), transparent 70%),
          radial-gradient(560px 460px at 102% 108%, rgba(0, 224, 198, 0.42), transparent 70%),
          var(--bg);
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.09;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 60px;
        font-family: var(--display);
        font-weight: 600;
        font-size: 30px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand .orb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, var(--teal), var(--violet) 70%);
        box-shadow: 0 0 18px rgba(0, 224, 198, 0.6);
      }
      .brand .dot { color: var(--lime); }
      .eyebrow {
        position: absolute;
        right: 72px;
        top: 68px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 15px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(236, 235, 228, 0.7);
      }
      .title {
        position: absolute;
        left: 72px;
        top: 150px;
        font-family: var(--display);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 92px;
        line-height: 0.9;
        letter-spacing: -0.035em;
      }
      .title .serif {
        display: block;
        font-family: var(--serif);
        font-style: italic;
        font-weight: 400;
        text-transform: none;
        font-size: 104px;
        letter-spacing: -0.02em;
        line-height: 0.95;
        padding-left: 64px;
        background: linear-gradient(100deg, var(--violet) 0%, var(--lime) 55%, var(--teal) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .title span { display: block; }
      .footer {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 56px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding-top: 24px;
        border-top: 1px solid rgba(236, 235, 228, 0.14);
        font-size: 24px;
      }
      .footer .who { color: rgba(236, 235, 228, 0.78); }
      .footer .who b { color: var(--ink); font-weight: 500; }
      .footer .url { color: var(--lime); font-family: var(--display); font-weight: 600; font-size: 28px; }
      .mark {
        position: absolute;
        right: 70px;
        top: 112px;
        width: 360px;
        height: 360px;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="grain"></div>

      <div class="brand"><span class="orb"></span><span>CWCODES<span class="dot">.</span></span></div>
      <div class="eyebrow" data-i18n="eyebrow"></div>

      <h1 class="title">
        <span data-i18n="l1"></span>
        <span class="serif" data-i18n="l2"></span>
        <span data-i18n="l3"></span>
      </h1>

      <svg class="mark" viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c5cff" />
            <stop offset="0.55" stop-color="#ccff00" />
            <stop offset="1" stop-color="#00e0c6" />
          </linearGradient>
          <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ccff00" stop-opacity="0.18" />
            <stop offset="1" stop-color="#ccff00" stop-opacity="0" />
          </radialGradient>
        </defs>
        <circle cx="200" cy="200" r="200" fill="url(#halo)" />
        <path
          d="M200 32 C 320 32, 368 80, 368 200 C 368 320, 320 368, 200 368 C 80 368, 32 320, 32 200 C 32 80, 80 32, 200 32 Z"
          fill="none"
          stroke="rgba(236,235,228,0.4)"
          stroke-width="1.8"
          transform="rotate(39 200 200)"
        />
        <text
          x="200"
          y="240"
          text-anchor="middle"
          font-family="Clash Display, Inter Display, sans-serif"
          font-weight="700"
          font-size="140"
          letter-spacing="-4"
          fill="url(#g)"
        >CW</text>
      </svg>

      <div class="footer">
        <span class="who" data-i18n="who"></span>
        <span class="url">cwcodes.de</span>
      </div>
    </div>

    <script>
      const copy = {
        de: {
          eyebrow: "Hamburg · DE",
          l1: "Digitale",
          l2: "Erlebnisse",
          l3: "gestalten",
          who: "<b>Connor Welge</b> · Webdesign &amp; Webentwicklung",
        },
        en: {
          eyebrow: "Hamburg · DE",
          l1: "Designing",
          l2: "digital",
          l3: "experiences",
          who: "<b>Connor Welge</b> · Web design &amp; development",
        },
      };
      const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "de";
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll("[data-i18n]")) el.innerHTML = copy[lang][el.dataset.i18n];
    </script>
  </body>
</html>
